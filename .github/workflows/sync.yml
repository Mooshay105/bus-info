name: Sync buses

on:
  schedule:
    - cron: "0 21 * * 0-4"
    - cron: "0 6 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "30 15 * * 1-5"
    - cron: "0 0 * * 6"
    - cron: "0 12 * * 6"
  workflow_dispatch:
    inputs:
      feeds:
        description: Feed ids to pull, separated by spaces (empty for all)
        required: false
        default: ""

concurrency:
  group: sync-buses
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      TRAFIKLAB_KEY: ${{ secrets.TRAFIKLAB_KEY }}
      BODS_KEY: ${{ secrets.BODS_KEY }}
      TFNSW_KEY: ${{ secrets.TFNSW_KEY }}
      PTV_KEY: ${{ secrets.PTV_KEY }}
      AT_KEY: ${{ secrets.AT_KEY }}
      METLINK_KEY: ${{ secrets.METLINK_KEY }}
      METRO_CHC_KEY: ${{ secrets.METRO_CHC_KEY }}
      FEEDS: ${{ github.event.inputs.feeds }}
    steps:
      - name: Check database secret
        run: |
          if [ -z "$TURSO_DATABASE_URL" ]; then
            echo "::error::TURSO_DATABASE_URL secret is not set"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/sync.ts $FEEDS --apply
